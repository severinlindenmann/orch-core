name: dashboard realhost (nightly)
# The dashboard's realhost tests start a real orch host and a pty-driven signer (#587). They are too slow and too
# environment-bound for every PR, so they run nightly on develop and on demand. NOT a required check (no ruleset
# lists it, no PR trigger): a red run is a signal to fix, it does not block merges.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dashboard-realhost
  cancel-in-progress: false
jobs:
  realhost:
    name: realhost tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: packages/addons/dashboard/server
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: develop
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: packages/addons/dashboard/server/uv.lock
      - run: uv sync --locked
      # a disposable HOME under the runner's home (short, not a sticky directory); the host state lives under it
      - name: run the realhost modules
        env:
          ORCH_REALHOST_STRICT: '1'  # a skip ("the real host cannot start here") fails the run
        run: |
          H="$(mktemp -d "$HOME/.rh-XXXXXX")"
          env -i HOME="$H" PATH="$PATH" USER="$USER" LANG=C.UTF-8 ORCH_REALHOST_STRICT=1 \
            "$GITHUB_WORKSPACE/packages/addons/dashboard/server/.venv/bin/python" -m pytest -m realhost -q -n 1 -rs
