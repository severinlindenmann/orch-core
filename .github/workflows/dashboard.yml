name: dashboard
on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]  # a draft is not tested until it is ready
  push:
    branches: [develop]  # a feature branch is tested once, through its PR
permissions:
  contents: read
  pull-requests: read  # the changed files of the PR, for the `changes` job
concurrency:  # draft-event and full runs never cancel each other
  group: dashboard-${{ github.ref }}-${{ github.event.pull_request.draft && 'draft' || 'full' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    # the workflow runs for every PR to develop (a ruleset needs its gate to report each time); the jobs below run only
    # when a file they cover changed
    name: dashboard changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.files.outputs.relevant }}
      heavy: ${{ steps.files.outputs.heavy }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            files="$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')"
          else
            files="$(gh api --paginate "repos/$REPO/commits/$SHA" --jq '.files[].filename')"
          fi
          if grep -Eq '^(packages/addons/dashboard/|packages/core/|docs/architecture/orch-v2-host\.md$|\.github/workflows/dashboard\.yml$)' <<<"$files"; then
            relevant=true
          else
            relevant=false
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          heavy=true  # the PR's LIVE draft state, not the payload (push and `gh pr ready` can race)
          if [ "$EVENT" = pull_request ] && [ "$(gh api "repos/$REPO/pulls/$PR" --jq .draft)" = true ]; then heavy=false; fi
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"
  vitest:
    name: vitest (shard ${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.relevant == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: packages/addons/dashboard
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/addons/dashboard/package-lock.json
      - run: npm ci
      - run: npx vitest run --maxWorkers=3 --shard=${{ matrix.shard }}/3
  node:
    name: node (layout check, typecheck, build)
    needs: changes
    if: needs.changes.outputs.relevant == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/addons/dashboard
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/addons/dashboard/package-lock.json
      - run: npm ci
      - run: node --test scripts/layout-startup.check.mjs
      - run: npm run typecheck
      - run: npm run build
  python:
    name: dashboard tests
    needs: changes
    if: needs.changes.outputs.relevant == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/addons/dashboard/server
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: packages/addons/dashboard/server/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      # The realhost module starts a real orch host and a pty-driven signer: run it locally (see server/README.md).
      - run: uv run pytest -q -m "not realhost" -n auto
  gate:
    # the one check a ruleset requires: it reports on every PR, also when the jobs above are skipped
    name: dashboard gate
    if: always()
    needs: [changes, vitest, node, python]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac  # skipped (draft, nothing relevant) is fine
