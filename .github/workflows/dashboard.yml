name: dashboard
on:
  pull_request:
    branches: [develop]
    paths: ['addons/dashboard/**', '.github/workflows/dashboard.yml']
  push:
    paths: ['addons/dashboard/**', '.github/workflows/dashboard.yml']
permissions:
  contents: read
concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: addons/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: addons/dashboard/package-lock.json
      - run: npm ci
      - run: npx vitest run --maxWorkers=3
      - run: npm run typecheck
      - run: npm run build
  python:
    name: dashboard tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    defaults:
      run:
        working-directory: addons/dashboard/server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: addons/dashboard/server/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q
