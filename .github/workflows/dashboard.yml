name: dashboard
on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]  # a draft is not tested until it is ready
    paths: ['addons/dashboard/**', 'plugins/orch-core/**', 'docs/architecture/orch-v2-host.md', '.github/workflows/dashboard.yml']
  push:
    branches: [develop]  # a feature branch is tested once, through its PR
    paths: ['addons/dashboard/**', 'plugins/orch-core/**', 'docs/architecture/orch-v2-host.md', '.github/workflows/dashboard.yml']
permissions:
  contents: read
concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  vitest:
    name: vitest (shard ${{ matrix.shard }}/3)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: addons/dashboard
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: addons/dashboard/package-lock.json
      - run: npm ci
      - run: npx vitest run --maxWorkers=3 --shard=${{ matrix.shard }}/3
  node:
    name: node (layout check, typecheck, build)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: addons/dashboard
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: addons/dashboard/package-lock.json
      - run: npm ci
      - run: node --test scripts/layout-startup.check.mjs
      - run: npm run typecheck
      - run: npm run build
  python:
    name: dashboard tests
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: addons/dashboard/server
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: addons/dashboard/server/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      # The realhost module starts a real orch host and a pty-driven signer: run it locally (see server/README.md).
      - run: uv run pytest -q -m "not realhost"
