name: dashboard
on:
  pull_request:
    branches: [develop]
    paths: ['addons/dashboard/**', 'plugins/orch-core/**', 'docs/architecture/orch-v2-host.md', '.github/workflows/dashboard.yml']
  push:
    paths: ['addons/dashboard/**', 'plugins/orch-core/**', 'docs/architecture/orch-v2-host.md', '.github/workflows/dashboard.yml']
permissions:
  contents: read
concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: addons/dashboard
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: addons/dashboard/package-lock.json
      - run: npm ci
      - run: npx vitest run --maxWorkers=3
      - run: node --test scripts/layout-startup.check.mjs
      - run: npm run typecheck
      - run: npm run build
  python:
    name: dashboard tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    defaults:
      run:
        working-directory: addons/dashboard/server
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: addons/dashboard/server/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q
