name: Visual mockup Pages

on:
  push:
    branches: [main, feat/mockup-pages]  # feat branch: one-off first deploy (owner 4 Nov), removed before merge
    paths:
      - 'packages/addons/dashboard/**'
      - 'docs/mockups/**'
      - 'scripts/dev/build-mockup-site.sh'
      - '.github/workflows/mockup-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/addons/dashboard/package-lock.json
      - run: bash scripts/dev/build-mockup-site.sh
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
