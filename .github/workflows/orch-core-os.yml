name: orch-core-os
# One click keeps its key in a key file on every OS (owner-only), so the custody, setup and host convenience unit tests
# run on macOS and Windows too: on PRs into develop that touch core (native path filter) and nightly. Ubuntu stays in
# orch-core.yml on every PR.
on:
  pull_request:
    branches: [develop]
    paths:
      - 'packages/core/**'
      - '.github/workflows/orch-core-os.yml'
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
concurrency:
  group: orch-core-os-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    working-directory: packages/core
    shell: bash
jobs:
  custody:
    name: ${{ matrix.os }} custody and convenience
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: packages/core/uv.lock
      - run: uv sync --locked
      - name: Required set, Windows - the key file round trip (the pytest conftest imports pwd, so no pytest here yet)
        if: runner.os == 'Windows'
        run: |
          uv run python - <<'PY'
          import os, tempfile
          from orch import crypto
          from orch.custody import convenience as c
          os.environ.setdefault("LOCALAPPDATA", tempfile.mkdtemp())
          store = c.open_store(tempfile.mkdtemp())
          assert store.kind == "file", store.kind
          ws, dev = "a" * 32, "d_" + "b" * 32
          store.put(ws, dev, bytes(range(32)), prefix="X")
          assert store.exists(ws, dev) and store.get(ws, dev) == bytes(range(32))
          store.delete(ws, dev)
          assert not store.exists(ws, dev)
          print("windows key file ok")
          PY
      - name: Required set, Unix - custody and convenience tests
        if: runner.os != 'Windows'
        run: |
          uv run pytest -q -m "not slow" -p no:cacheprovider tests/custody
          uv run pytest -q -m "not slow" -p no:cacheprovider tests/setup tests/host -k convenience
