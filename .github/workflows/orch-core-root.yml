name: orch-core root tests
# tests/setup/test_osapply_linux_root.py creates real system users and units on the runner. Its `useradd` step hangs
# past 120 s on about one run in three (even run alone), so it is NOT part of PR CI and not a required check. It runs
# nightly and on demand; a failure here prints what the hung process waited for (see the diagnose step).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: packages/core
jobs:
  root-tests:
    name: root tests (real useradd / systemd)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: packages/core/uv.lock
      - run: uv sync --locked
      - name: Watch for a hung useradd (background, evidence only)
        run: |
          nohup bash -c 'while sleep 20; do for p in $(pgrep -x useradd); do
            echo "== $(date +%T) useradd $p"; sudo cat /proc/$p/stack /proc/$p/wchan 2>&1; sudo ls -l /proc/$p/fd 2>&1
            ps -eo pid,ppid,stat,wchan:30,etime,cmd --sort=etime | tail -25; df -h /var /home; done; done' > "$RUNNER_TEMP/useradd-watch.log" 2>&1 &
      - run: uv run pytest -q -m "linux_root and not slow" -p no:xdist
      - if: always()
        run: cat "$RUNNER_TEMP/useradd-watch.log" || true
