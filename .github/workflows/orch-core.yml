name: orch-core
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
permissions:
  contents: read
concurrency:  # a newer push to the same PR cancels the run still going
  group: orch-core-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    working-directory: plugins/orch-core
jobs:
  tests:
    name: core tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: plugins/orch-core/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest -q -m "not slow" -n auto
        env:
          # The 3.14 leg must have Unicode 16.0, so the canon comparison tests can never skip silently there.
          ORCH_REQUIRE_UNICODE16: ${{ matrix.python == '3.14' && '1' || '' }}
