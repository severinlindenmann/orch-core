name: orch-core
on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]  # a draft is not tested until it is ready
  push:
    branches: [develop]
permissions:
  contents: read
  pull-requests: read  # the `mode` job reads the PR's live draft state
concurrency:  # a newer push to the same PR cancels the run still going; draft-event and full runs never cancel each other
  group: orch-core-${{ github.ref }}-${{ github.event.pull_request.draft && 'draft' || 'full' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    working-directory: plugins/orch-core
jobs:
  mode:
    # Decides from the PR's LIVE draft state, not the event payload: a push and `gh pr ready` can race, and the payload
    # then says draft for the head that is in fact ready (23 Oct: #1056 got a skipped run, gate green, no tests).
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: .
    outputs:
      heavy: ${{ steps.m.outputs.heavy }}
    steps:
      - id: m
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          heavy=true
          if [ "${{ github.event_name }}" = pull_request ]; then
            d=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" -q .draft)
            [ "$d" = true ] && heavy=false
          fi
          echo "draft=${d:-n/a} heavy=$heavy"; echo "heavy=$heavy" >> "$GITHUB_OUTPUT"
  tests:
    name: core tests (${{ matrix.shard }}/3)
    needs: mode
    if: needs.mode.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]  # whole test modules per slice (tests/_shard.py): every selected test runs in exactly one
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: plugins/orch-core/uv.lock
      - run: uv sync --locked
      - if: matrix.shard == 1  # the lint is the same in every slice
        run: uv run ruff check
      - if: matrix.shard == 1
        run: uv run ruff format --check
      # the T2 real-relay tests run in their own job (relay-t2), never here
      - run: uv run pytest -q -m "not slow and not relay_t2" -n auto
        env:
          ORCH_TEST_SHARD: ${{ matrix.shard }}/3
          # The runtime must have Unicode 16.0, so the canon comparison tests can never skip silently.
          ORCH_REQUIRE_UNICODE16: "1"
  standalone:
    # D79: orch core always works standalone. No hub code imported anywhere in core or add-ons, and a fresh workspace
    # works with the network down. Runs on drafts too (cheap, a few seconds); needs no secret and no network.
    name: standalone (D79)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: plugins/orch-core/uv.lock
      - run: uv sync --locked
      - run: uv run pytest tests/test_standalone_d79.py -q -m ""
  perf-schema:
    # the slow marker holds, among others, the check that all 52 operation declarations validate against the
    # operation schema (startup does not validate); xdist, so it is quick
    name: core slow tests
    needs: mode
    if: needs.mode.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: plugins/orch-core/uv.lock
      - run: uv sync --locked
      - run: uv run pytest -q -m slow -n auto --deselect tests/ops/test_perf.py --deselect tests/store/test_perf.py --deselect tests/model/test_perf.py
        env:
          ORCH_REQUIRE_UNICODE16: "1"
  perf-budgets:
    # the latency budgets run alone, in their own job: nothing else on the machine while they measure
    name: core latency budgets
    needs: mode
    if: needs.mode.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: plugins/orch-core/uv.lock
      - run: uv sync --locked
      - run: uv run pytest -q -m slow -p no:xdist tests/ops/test_perf.py tests/store/test_perf.py tests/model/test_perf.py
  relay-t2:
    # 11A.10 harness layer 2: core's relay client and bridge loop against the REAL orch-relay at the commit pinned in
    # tests/relay/vectors/SOURCE, on loopback only (no deployed relay is ever contacted). Its own job, so the main
    # matrix is not slowed; the tests fail (never skip) here if the relay checkout is missing.
    name: relay T2 (real relay, py3.14)
    needs: mode
    if: needs.mode.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: read the pinned relay commit from SOURCE
        id: source
        run: |
          test "$(grep -c '^relay_commit:' tests/relay/vectors/SOURCE)" = 1 || { echo "not exactly one relay_commit in SOURCE" >&2; exit 1; }
          commit="$(sed -n 's/^relay_commit: *\([0-9a-f]\{40\}\)$/\1/p' tests/relay/vectors/SOURCE | head -1)"
          test -n "$commit" || { echo "no 40-hex relay_commit in SOURCE" >&2; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: severinlindenmann/orch-relay
          ref: ${{ steps.source.outputs.commit }}
          path: orch-relay
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: |
            plugins/orch-core/uv.lock
            orch-relay/uv.lock
      - run: uv sync --locked
      - run: uv sync --locked
        working-directory: orch-relay
      # T2 (relay_t2 and the harness self-tests) and the drift guard's optional cross-check of the vendored corpus
      - run: uv run pytest -q -p no:xdist -rs tests/relay/t2 tests/relay/test_corpus.py::test_corpus_equals_the_relay_at_the_pinned_commit
        timeout-minutes: 8
        env:
          ORCH_RELAY_DIR: ${{ github.workspace }}/orch-relay
          ORCH_RELAY_T2_REQUIRED: "1"
  publish-e2e:
    # e2e/run.sh publish-isolation (#296): two sandbox workspaces against a REAL `orch-publish dev` (develop) on
    # loopback. Not in the gate: it follows another repo's develop, so it reports but does not block this repo.
    name: publish isolation e2e
    needs: mode
    if: needs.mode.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: severinlindenmann/orch-publish
          ref: develop
          path: orch-publish
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: |
            plugins/orch-core/uv.lock
            orch-publish/uv.lock
      - run: uv sync --locked
        working-directory: plugins/orch-core
      - run: uv sync --locked
        working-directory: orch-publish
      - run: e2e/run.sh publish-isolation
        working-directory: .
        env:
          ORCH_PUBLISH_SRC: ${{ github.workspace }}/orch-publish
  gate:
    # the one check a ruleset requires: it reports on every PR, also when the jobs above are skipped
    name: core gate
    if: always()
    needs: [mode, tests, perf-schema, perf-budgets, relay-t2]  # mode: a failed draft check fails the gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .  # the workflow default is plugins/orch-core, which this job never checks out
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac  # skipped (draft, nothing relevant) is fine
