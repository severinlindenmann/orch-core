name: orch-core
on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]  # a draft is not tested until it is ready
  push:
    branches: [develop]
permissions:
  contents: read
  pull-requests: read  # the `mode` job reads the PR's live draft state
concurrency:  # a newer push to the same PR cancels the run still going; draft-event and full runs never cancel each other
  group: orch-core-${{ github.ref }}-${{ github.event.pull_request.draft && 'draft' || 'full' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    working-directory: packages/core
jobs:
  changes:
    # the workflow runs for every PR to develop (the ruleset needs "core gate" on each); the jobs run when core, a
    # contract it reads, the add-ons it scans or the release/dev scripts changed
    name: core changes
    uses: ./.github/workflows/_changes.yml
    with:
      pattern: '^(packages/core/|packages/addons/|contracts/|docs/architecture/|scripts/|\.claude-plugin/|\.github/plugin/|\.github/workflows/(orch-core|_changes)\.yml$)'
  tests:
    name: core tests (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.relevant == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]  # whole test modules per slice (tests/_shard.py): every selected test runs in exactly one
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: packages/core/uv.lock
      - run: uv sync --locked
      - name: Pinned Caddy for tests/setup/test_caddy_validate.py
        # Every slice, not one: the slices hold whole modules, so the module may land in any of them, and in CI a
        # missing ORCH_CADDY_BIN fails the test. v2.11.7 (not a pre-release); the checksum is the SHA-512 line for
        # caddy_2.11.7_linux_amd64.tar.gz in the release's own caddy_2.11.7_checksums.txt.
        run: |
          set -euo pipefail
          url=https://github.com/caddyserver/caddy/releases/download/v2.11.7/caddy_2.11.7_linux_amd64.tar.gz
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/caddy.tar.gz" "$url"
          echo "a7a433a1b133efc3c8d10eb0b99d52a24b5ef5c322dc77f5282182b1c0402139ab83f3a99f0c52409df77d20123fb0b523edad8a66d8f5e49136197bf61ef0e7  $RUNNER_TEMP/caddy.tar.gz" | sha512sum -c -
          mkdir "$RUNNER_TEMP/caddy"
          tar -xzf "$RUNNER_TEMP/caddy.tar.gz" -C "$RUNNER_TEMP/caddy" caddy
          echo "ORCH_CADDY_BIN=$RUNNER_TEMP/caddy/caddy" >> "$GITHUB_ENV"
      - if: matrix.shard == 1  # the lint is the same in every slice
        run: uv run ruff check
      - if: matrix.shard == 1
        run: uv run ruff format --check
      - run: uv run pytest -q -m "not slow" -n auto
        env:
          ORCH_TEST_SHARD: ${{ matrix.shard }}/3
          # The runtime must have Unicode 16.0, so the canon comparison tests can never skip silently.
          ORCH_REQUIRE_UNICODE16: "1"
  standalone:
    # D79: orch core always works standalone. No hub code imported anywhere in core or add-ons, and a fresh workspace
    # works with the network down. Runs on drafts too (cheap, a few seconds); needs no secret and no network.
    name: standalone (D79)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: packages/core/uv.lock
      - run: uv sync --locked
      - run: uv run pytest tests/test_standalone_d79.py -q -m ""
  perf-schema:
    # the slow marker holds, among others, the check that all 52 operation declarations validate against the
    # operation schema (startup does not validate); xdist, so it is quick
    name: core slow tests
    needs: changes
    if: needs.changes.outputs.relevant == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: packages/core/uv.lock
      - run: uv sync --locked
      - run: uv run pytest -q -m slow -n auto --deselect tests/ops/test_perf.py --deselect tests/store/test_perf.py --deselect tests/model/test_perf.py
        env:
          ORCH_REQUIRE_UNICODE16: "1"
  perf-budgets:
    # the latency budgets run alone, in their own job: nothing else on the machine while they measure
    name: core latency budgets
    needs: changes
    if: needs.changes.outputs.relevant == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: packages/core/uv.lock
      - run: uv sync --locked
      - run: uv run pytest -q -m slow -p no:xdist tests/ops/test_perf.py tests/store/test_perf.py tests/model/test_perf.py
  gate:
    # the one check a ruleset requires: it reports on every PR, also when the jobs above are skipped
    name: core gate
    if: always()
    needs: [changes, tests, perf-schema, perf-budgets, standalone]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .  # the workflow default is packages/core, which this job never checks out
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac  # skipped (draft, nothing relevant) is fine
