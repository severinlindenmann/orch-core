name: windows-smoke
# Report only: runs the core unit suite on Windows to learn what breaks. NOT a required gate (never add it to the ruleset).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  pull_request:
    paths:
      - .github/workflows/windows-smoke.yml
permissions:
  contents: read
concurrency:
  group: windows-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    name: core unit suite on Windows (report only)
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    defaults:
      run:
        shell: bash
        working-directory: packages/core
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: packages/core/uv.lock
      - name: Sync
        id: sync
        continue-on-error: true
        run: uv sync --locked 2>&1 | tee sync.log
      - name: Unit suite
        id: tests
        continue-on-error: true
        run: |
          uv run pytest -q -m "not slow" -p no:cacheprovider -rfE --junitxml=junit-windows.xml 2>&1 | tee pytest.log
      - name: Summary
        if: always()
        run: |
          {
            echo "windows-smoke on $(date -u +%FT%TZ), sha $GITHUB_SHA"
            echo "sync: ${{ steps.sync.outcome }}, tests: ${{ steps.tests.outcome }}"
            tail -n 5 pytest.log 2>/dev/null || tail -n 20 sync.log
          } | tee summary.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-smoke
          path: |
            packages/core/junit-windows.xml
            packages/core/summary.txt
            packages/core/pytest.log
            packages/core/sync.log
          if-no-files-found: warn
