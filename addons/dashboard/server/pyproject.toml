[project]
name = "orch-dashboard"
version = "0.1.0"
description = "Local read-only orch dashboard addon"
requires-python = ">=3.11"
dependencies = ["fastapi==0.115.12", "starlette==0.46.2", "uvicorn==0.34.2"]

[project.scripts]
orch-dashboard = "orch_dashboard.__main__:main"

[dependency-groups]
dev = ["pytest==8.3.5", "httpx==0.28.1", "ruff==0.11.8", "orch-core"]

[tool.uv.sources]
orch-core = { path = "../../../plugins/orch-core", editable = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orch_dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["realhost: runs a real orch host (core) as a subprocess; skipped when it cannot start"]
pythonpath = ["..", "../../../plugins/orch-core"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Long prose lines in the real-host kit and tests (prompts, reasons and findings read better unwrapped).
"tests/realhost_kit.py" = ["E501"]
"tests/test_realhost.py" = ["E501"]
