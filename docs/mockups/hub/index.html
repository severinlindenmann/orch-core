<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>orch hub · full mockup</title>
<style>
:root{
  --bg:#0e1014; --sidebar:#0a0c0f; --rail:#07090b; --surface:#15181d; --surface-2:#1c2027; --surface-3:#242a32;
  --border:#2a3038; --border-strong:#3a424d; --text:#e8eaed; --text-muted:#9aa3ad; --text-faint:#8b949e;
  --brand:#2fc6a3; --on-brand:#06231c; --brand-soft:rgba(47,198,163,.14);
  --success:#4ade80; --success-soft:rgba(74,222,128,.12); --warning:#fbbf24; --warning-soft:rgba(251,191,36,.13);
  --danger:#f87171; --danger-soft:rgba(248,113,113,.13); --info:#60a5fa; --info-soft:rgba(96,165,250,.13);
  --violet:#b392f0; --violet-soft:rgba(179,146,240,.14);
  --note:#e9c46a; --note-soft:rgba(233,196,106,.09); --note-line:rgba(233,196,106,.45);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.5 Geist,-apple-system,system-ui,"Segoe UI",sans-serif}
.mono,code{font-family:"Geist Mono",ui-monospace,Menlo,monospace}
code{font-size:12px;background:var(--surface-3);padding:1px 5px;border-radius:4px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
a{color:var(--brand)}
button{font:inherit;color:inherit}
.bnr{height:30px;display:flex;align-items:center;gap:12px;padding:0 12px;font:500 11px "Geist Mono",monospace;color:var(--text-faint);border-bottom:1px solid var(--border);white-space:nowrap;overflow:hidden}
.bnr b{color:var(--note)}
.bnr .sp{flex:1}
.bnr label{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--text-muted)}
.app{display:grid;grid-template-columns:60px 236px minmax(0,1fr);height:calc(100vh - 30px)}
/* rail */
.rail{background:var(--rail);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 0;overflow-y:auto}
.ra{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);color:var(--text);font:700 14px Geist,system-ui,sans-serif;position:relative;cursor:pointer;border:2px solid transparent;flex:none}
.ra.hub{border-radius:50%;border:3px solid var(--brand);background:transparent;color:var(--brand)}
.ra.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:4px;border-radius:0 3px 3px 0;background:var(--text)}
.ra .bd{position:absolute;top:-6px;right:-7px;background:var(--brand);color:var(--on-brand);font:700 10px/15px "Geist Mono",monospace;min-width:17px;height:17px;border-radius:999px;text-align:center;border:2px solid var(--rail);padding:0 3px}
.ra .dot{position:absolute;bottom:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--text-faint);border:2px solid var(--rail)}
.ra .dot.ok{background:var(--success)}
.ra.add{background:transparent;border:1px dashed var(--border-strong);color:var(--text-muted)}
.ra.me{border-radius:50%;font:600 11px "Geist Mono",monospace;background:var(--surface-3);color:var(--text-muted)}
.rsep{width:24px;height:1px;background:var(--border);flex:none}
.rail .grow{flex:1}
/* sidebar */
.side{background:var(--sidebar);border-right:1px solid var(--border);padding:12px 8px;display:flex;flex-direction:column;gap:1px;font-size:13px;overflow-y:auto}
.hubname{display:flex;align-items:center;gap:9px;padding:4px 8px 12px}
.hubname .lg{width:22px;height:22px;border-radius:50%;border:3px solid var(--brand)}
.hubname b{font-size:15px;letter-spacing:-.01em}
.hubname small{display:block;color:var(--text-faint);font:500 11px "Geist Mono",monospace}
.grp{font:600 10px "Geist Mono",monospace;letter-spacing:.12em;color:var(--text-faint);padding:14px 9px 4px}
.nv{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;color:var(--text-muted);cursor:pointer;user-select:none}
.nv:hover{color:var(--text);background:var(--surface)}
.nv.on{background:var(--surface-2);color:var(--text)}
.nv .ct{margin-left:auto;font:600 11px "Geist Mono",monospace;background:var(--brand-soft);color:var(--brand);padding:0 6px;border-radius:999px}
.nv .ct.w{background:var(--warning-soft);color:var(--warning)}
.nv .nw{margin-left:auto;font:600 9px "Geist Mono",monospace;color:var(--note);border:1px solid var(--note-line);padding:0 4px;border-radius:4px}
.side .foot{margin-top:auto;padding:12px 9px 0;color:var(--text-faint);font-size:12px;border-top:1px solid var(--border)}
/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding:12px 22px;border-bottom:1px solid var(--border);min-height:56px}
.top .t{font-weight:600;font-size:15px}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font:500 12px Geist,system-ui,sans-serif;padding:3px 9px;border-radius:999px;border:1px solid var(--border-strong);color:var(--text-muted);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--success);display:inline-block}
.pill i.w{background:var(--warning)} .pill i.o{background:var(--text-faint)} .pill i.d{background:var(--danger)}
.content{overflow-y:auto;padding:22px 22px 80px;min-height:0}
.content>.inner{max-width:1080px}
h1{font-size:24px;letter-spacing:-.02em;margin:0 0 4px}
.lead{color:var(--text-muted);margin:0 0 18px;max-width:760px}
h2{font-size:15px;margin:26px 0 10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:14px;overflow:hidden}
.card .hd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);font-weight:600}
.card .hd .sp{flex:1}
.card .cb{padding:14px 16px}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--border)}
.card .row:first-child{border-top:0}
.card .hd+.row{border-top:0}
.row .tx{flex:1;min-width:0}
.row .tx b{font-weight:600}
.row .tx .s{color:var(--text-muted);font-size:12.5px}
.row:hover{background:rgba(255,255,255,.015)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;cursor:pointer}
.stat .n{font-size:26px;font-weight:700;letter-spacing:-.02em}
.stat .l{color:var(--text-muted);font-size:12.5px}
.stat.w .n{color:var(--warning)} .stat.g .n{color:var(--brand)}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;white-space:nowrap;min-height:32px}
.btn:hover{border-color:var(--text-faint)}
.btn.pri{background:var(--brand);color:var(--on-brand);border-color:var(--brand);font-weight:600}
.btn.dan{color:var(--danger);border-color:rgba(248,113,113,.4)}
.btn.sm{padding:3px 9px;font-size:12px;min-height:28px}
.btn.gh{background:transparent;border-color:transparent;color:var(--text-muted)}
.tag{display:inline-flex;align-items:center;font:500 11px "Geist Mono",monospace;padding:1px 7px;border-radius:5px;background:var(--surface-3);color:var(--text-muted);white-space:nowrap}
.tag.g{background:var(--brand-soft);color:var(--brand)} .tag.w{background:var(--warning-soft);color:var(--warning)}
.tag.d{background:var(--danger-soft);color:var(--danger)} .tag.v{background:var(--violet-soft);color:var(--violet)}
.tag.i{background:var(--info-soft);color:var(--info)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:600 11px "Geist Mono",monospace;background:var(--surface-3);color:var(--text-muted);flex:none}
.wsb{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:700 12px Geist,sans-serif;flex:none}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font:600 10.5px "Geist Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);padding:9px 16px;border-bottom:1px solid var(--border)}
td{padding:10px 16px;border-top:1px solid var(--border);vertical-align:middle}
tr:first-child td{border-top:0}
.tw{overflow-x:auto}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;background:var(--bg)}
.seg button{background:transparent;border:0;color:var(--text-muted);padding:3px 10px;font-size:12px;cursor:pointer;min-height:28px}
.seg button+button{border-left:1px solid var(--border)}
.seg button.on{background:var(--brand-soft);color:var(--brand)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:0 0 16px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;color:var(--text-muted);cursor:pointer}
.tabs button.on{color:var(--text);border-bottom-color:var(--brand)}
.ban{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin-bottom:14px;background:var(--surface)}
.ban.w{border-color:rgba(251,191,36,.4);background:var(--warning-soft)}
.ban.g{border-color:rgba(47,198,163,.4);background:var(--brand-soft)}
.ban .tx{flex:1}
.ban .tx .s{color:var(--text-muted);font-size:13px}
.input{width:100%;background:var(--bg);border:1px solid var(--border-strong);border-radius:8px;padding:8px 10px;color:var(--text);font:inherit}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:4px}
.facts{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:13px;margin:0}
.facts dt{color:var(--text-muted)} .facts dd{margin:0}
.flow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px}
.node{border:1px solid var(--border-strong);border-radius:10px;padding:10px 12px;background:var(--bg);min-width:130px}
.node b{display:block}
.node .s{font-size:12px;color:var(--text-muted)}
.node.ok{border-color:rgba(74,222,128,.45)} .node.off{border-color:rgba(251,191,36,.5)} .node.hubn{border-color:var(--brand);background:var(--brand-soft)}
.arrow{color:var(--text-faint);font:500 11px "Geist Mono",monospace;text-align:center}
.wsgrid{display:grid;grid-template-columns:1fr;gap:6px}
/* notes (requirements layer) */
.note{border:1px dashed var(--note-line);background:var(--note-soft);border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:13px;color:#e8dcb8}
.note .nt{font:600 10.5px "Geist Mono",monospace;letter-spacing:.1em;color:var(--note);margin-bottom:4px;display:flex;gap:8px;align-items:center}
.note ul{margin:4px 0 0;padding-left:18px}
.note li{margin:2px 0}
.st-today{color:var(--success)} .st-part{color:var(--warning)} .st-new{color:var(--note)}
body.nonotes .note{display:none}
/* dialogs & toast */
.ovl{position:fixed;inset:0;background:rgba(5,7,9,.62);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{background:var(--surface);border:1px solid var(--border-strong);border-radius:14px;width:min(520px,100%);max-height:calc(100vh - 32px);overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.dlg .dh{padding:16px 18px 6px;font-weight:600;font-size:16px;display:flex;gap:10px;align-items:center}
.dlg .db{padding:6px 18px 12px}
.dlg .df{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--border)}
.signbox{border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--bg);margin:8px 0}
.signbox .h{font-weight:600;margin-bottom:4px}
details summary{cursor:pointer;color:var(--text-muted);font-size:13px;margin:6px 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--border-strong);border-radius:10px;padding:10px 16px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100vw - 24px)}
.qr{width:150px;height:150px;background:repeating-conic-gradient(#e8eaed 0 25%,#0e1014 0 50%) 0 0/18px 18px;border-radius:8px;border:8px solid #e8eaed}
.req td .seg button{padding:2px 8px}
.muted{color:var(--text-muted)} .faint{color:var(--text-faint)} .small{font-size:12.5px}
.empty{padding:26px 16px;text-align:center;color:var(--text-muted)}
.sw{width:34px;height:20px;border-radius:999px;background:var(--surface-3);position:relative;cursor:pointer;flex:none;border:1px solid var(--border-strong)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--text-muted);transition:left .15s}
.sw.on{background:var(--brand)} .sw.on::after{left:16px;background:var(--on-brand)}
.menu-btn{display:none}
/* ---- look & feel patterns */
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.sk{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 37%,var(--surface-2) 63%);background-size:400% 100%;animation:shim 1.2s ease infinite;border-radius:6px}
@keyframes shim{0%{background-position:100% 50%}100%{background-position:0 50%}}
.enter{animation:enter .22s ease both}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.leaving{animation:leave .32s ease forwards;overflow:hidden}
@keyframes leave{0%{max-height:90px}40%{opacity:0;transform:translateX(28px)}100%{opacity:0;transform:translateX(28px);max-height:0;padding-top:0;padding-bottom:0;border-width:0}}
.flash{animation:flash 1.8s ease}
@keyframes flash{0%,30%{background:var(--brand-soft)}100%{background:transparent}}
.pill i.live,.ra .dot.ok{animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.55)}70%{box-shadow:0 0 0 6px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.ovl{animation:fadein .15s ease}
.dlg{animation:pop .18s cubic-bezier(.2,.9,.3,1.2)}
@keyframes fadein{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(6px)}}
.toast{animation:toastin .22s ease;display:flex;align-items:center;gap:12px}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px)}}
.btn{transition:border-color .12s,background .12s,transform .08s}
.btn:active{transform:scale(.97)}
.nv,.row,.stat{transition:background .12s,color .12s,border-color .12s}
.stat:hover{border-color:var(--border-strong)}
.btn.loading{pointer-events:none;opacity:.8}
.btn.loading::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.offbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:8px 22px;background:var(--warning-soft);border-bottom:1px solid rgba(251,191,36,.4);font-size:13px}
.offbar .sp{flex:1}
.kbd{font:600 11px "Geist Mono",monospace;border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--text-muted);background:var(--surface-2)}
.pal{position:fixed;inset:0;z-index:55;background:rgba(5,7,9,.55);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px;animation:fadein .12s}
.pal .box{width:min(620px,100%);background:var(--surface);border:1px solid var(--border-strong);border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.55);overflow:hidden;animation:pop .16s ease}
.pal input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--border);padding:14px 16px;color:var(--text);font:16px Geist,system-ui,sans-serif;outline:none}
.pal .res{max-height:50vh;overflow-y:auto;padding:6px}
.pal .it{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer}
.pal .it.sel{background:var(--surface-2)}
.pal .it .k{margin-left:auto;font:500 11px "Geist Mono",monospace;color:var(--text-faint)}
.pal .gh2{font:600 10px "Geist Mono",monospace;letter-spacing:.12em;color:var(--text-faint);padding:8px 10px 2px}
.hint{position:fixed;right:16px;bottom:16px;z-index:30;font-size:12px;color:var(--text-faint);display:flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px 10px;cursor:pointer}
.lf{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.lf .card{margin:0}
.lf .cb p{margin:4px 0 10px;color:var(--text-muted);font-size:13px}
/* skill map (draft) */
.sktabs{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 14px}
.sktabs .seg button{padding:6px 12px;font-size:13px;border:0;background:transparent;color:var(--text-muted);cursor:pointer}
.sktabs .seg button.on{background:var(--surface-3);color:var(--text)}
.sktabs .seg .c{margin-left:6px;background:var(--warning-soft);color:var(--warning);border-radius:999px;padding:0 6px;font:600 11px "Geist Mono",monospace}
.sktabs select{background:var(--surface-2);border:1px solid var(--border-strong);border-radius:8px;color:var(--text);padding:5px 9px;font:inherit;font-size:13px}
.sksum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.sksum span{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:6px 11px;font-size:12.5px;color:var(--text-muted);display:flex;align-items:center;gap:6px}
.sksum b{color:var(--text);font-size:14px}
.hd8{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:var(--text-faint)}
.hd8.ok{background:var(--success)} .hd8.warn{background:var(--warning)} .hd8.bad{background:var(--danger)} .hd8.idle{background:var(--text-faint)}
.smap{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:56px;margin-bottom:8px}
.smap h3{font:600 10.5px "Geist Mono",monospace;letter-spacing:.12em;color:var(--text-faint);margin:0 0 10px;text-transform:uppercase}
.smap h3 small{letter-spacing:0;text-transform:none;font-weight:400;margin-left:6px}
.sn{position:relative;z-index:2;display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin-bottom:8px;cursor:pointer;width:100%;text-align:left;color:var(--text);font:inherit;transition:opacity .15s,border-color .15s}
.sn:hover{border-color:var(--border-strong)}
.sn .ic2{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none}
.sn .ic2 svg.i{width:14px;height:14px}
.sn .nm{font-weight:600;font-size:13px;line-height:1.25;display:block}
.sn .sb{display:block;color:var(--text-faint);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sn .tx{min-width:0;flex:1}
.sn .rt{display:flex;align-items:center;gap:5px;flex:none}
.sn.k-skill .ic2{background:var(--brand-soft);color:var(--brand)}
.sn.k-mcp .ic2{background:var(--violet-soft);color:var(--violet)}
.sn.k-cli .ic2,.sn.k-script .ic2{background:var(--info-soft);color:var(--info)}
.sn.k-sys .ic2{background:var(--note-soft);color:var(--note)}
.kt{font:500 10.5px "Geist Mono",monospace;color:var(--warning);background:var(--warning-soft);border-radius:5px;padding:0 5px;white-space:nowrap}
.smap.focus .sn{opacity:.25}
.smap.focus .sn.hl{opacity:1;border-color:var(--brand)}
.smap svg.edges{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible}
.smap svg.edges path{fill:none;stroke:var(--border-strong);stroke-width:1.3}
.smap svg.edges path.hl{stroke:var(--brand);stroke-width:2}
.smap svg.edges path.drift{stroke:var(--danger);stroke-dasharray:4 4}
.smap.focus svg.edges path:not(.hl){opacity:.12}
.sklg{display:flex;gap:16px;color:var(--text-faint);font-size:12px;flex-wrap:wrap;margin-bottom:14px}
.sklg span{display:flex;align-items:center;gap:6px}
.sklg i.l{width:22px;border-top:2px solid var(--border-strong)} .sklg i.d{width:22px;border-top:2px dashed var(--danger)}
.skatt{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.skatt .card{margin:0;cursor:pointer;padding:13px 15px}
.skatt .card:hover{border-color:var(--border-strong)}
.skatt .h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.skatt .why{font-size:12.5px;color:var(--text-muted)}
.skatt .fx{margin-top:8px;font-size:12.5px;color:var(--brand)}
.skcmp td.c{text-align:center}
.skcmp .on{display:inline-block;width:13px;height:13px;border-radius:50%;background:var(--brand)}
.skcmp .off{display:inline-block;width:13px;height:13px;border-radius:50%;border:1px solid var(--border-strong)}
.skcmp tr.sr{cursor:pointer} .skcmp tr.sr:hover td{background:rgba(255,255,255,.02)}

.drawer{position:fixed;top:0;right:0;bottom:0;width:430px;max-width:100vw;background:var(--surface);border-left:1px solid var(--border-strong);box-shadow:-24px 0 50px rgba(0,0,0,.45);padding:20px 22px 28px;overflow-y:auto;z-index:60;animation:drw .18s ease}

.drawer .x{position:absolute;right:12px;top:10px}
.drawer h3{margin:0 0 2px;font-size:18px}
.drawer .what{font-size:15px;line-height:1.45;margin:12px 0 8px}
.drawer h4{font:600 10.5px "Geist Mono",monospace;letter-spacing:.12em;color:var(--text-faint);text-transform:uppercase;margin:20px 0 8px}
.drawer .iss{border-radius:9px;padding:9px 11px;font-size:13px;margin-bottom:8px;background:var(--surface-2);border-left:3px solid var(--warning)}
.drawer .iss.bad{border-left-color:var(--danger)} .drawer .iss.idle{border-left-color:var(--text-faint)}
.drawer .iss small{display:block;color:var(--text-muted);margin-top:2px}
.drawer .when{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:13px}
.drawer .steps div{display:flex;gap:10px;font-size:13px;color:var(--text-muted);margin-bottom:5px}
.drawer .steps b{color:var(--text-faint);font:600 11px "Geist Mono",monospace;width:14px;flex:none;padding-top:2px}
.drawer .st3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.drawer .st3 div{background:var(--surface-2);border-radius:9px;padding:8px 10px;font-size:11.5px;color:var(--text-muted)}
.drawer .st3 b{display:block;font-size:17px;color:var(--text)}
.drawer .chips{display:flex;flex-wrap:wrap;gap:6px}
.drawer details{margin-top:18px;border-top:1px solid var(--border);padding-top:10px;color:var(--text-faint);font-size:12px}
.drawer details summary{cursor:pointer}
.drawer pre{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;overflow:auto;font:11.5px/1.5 "Geist Mono",monospace;color:var(--text-muted);white-space:pre-wrap}

.drawer .tag{white-space:normal}
.sktabs .seg{flex-wrap:wrap;max-width:100%}
.brk{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:2px solid var(--danger);color:var(--danger);font:700 10px/1 "Geist Mono",monospace}
.skwho{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.skchip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--text);cursor:pointer}
.skchip:hover{border-color:var(--border-strong)}
.skchip span{color:var(--text-faint);font-size:11.5px}
.skchip.chg span:first-of-type{color:var(--warning)}
.paths{display:flex;flex-direction:column;gap:6px}
.pth{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface-2);border-radius:9px;padding:7px 10px;font-size:13px}
.pth .a small{display:block;color:var(--text-faint);font-size:11px}
.pth .ar{color:var(--text-faint)}
.pth.bad{border:1px dashed rgba(248,113,113,.5)}
.skcmp td{vertical-align:top}

}

function webSvg(){
  const n = D.ws.length, cx = 300, cy = 200, R = 158, r = 32;
  const pos = {}; D.ws.forEach((w, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; pos[w.id] = [cx + R * Math.cos(a), cy + R * Math.sin(a)]; });
  const has = (a, b) => D.conns.some(([f, t]) => f === a && t === b);
  let edges = "";
  for (const [f, t] of D.conns) {
    const [x1, y1] = pos[f], [x2, y2] = pos[t], dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
    const off = has(t, f) ? 7 : 0, ox = -uy * off, oy = ux * off;
    const hi = selNode && (f === selNode || t === selNode), dim = selNode && !hi;
    edges += `<line x1="${x1 + ux * r + ox}" y1="${y1 + uy * r + oy}" x2="${x2 - ux * (r + 6) + ox}" y2="${y2 - uy * (r + 6) + oy}" stroke="${hi ? (f === selNode ? "#2fc6a3" : "#b392f0") : "#5b6573"}" stroke-width="${hi ? 2.6 : 1.8}" opacity="${dim ? .18 : 1}" marker-end="url(#ar${hi ? (f === selNode ? "g" : "v") : ""})"/>`;
  }
  const nodes = D.ws.map((w) => { const [x, y] = pos[w.id], on = selNode === w.id; return `<g data-node="${w.id}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="${r}" fill="${w.color}22" stroke="${on ? "#e8eaed" : w.color}" stroke-width="${on ? 3 : 2}"/><text x="${x}" y="${y + 6}" text-anchor="middle" fill="${w.color}" font-weight="700" font-size="17">${esc(w.prefix)}</text><text x="${x}" y="${y + r + 17}" text-anchor="middle" fill="#e8eaed" font-size="12.5">${esc(w.name)}${w.online ? "" : " · offline"}</text></g>`; }).join("");
  const mk = (id, c) => `<marker id="ar${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${c}"/></marker>`;
  return `<svg viewBox="0 0 600 410" style="width:100%;max-width:640px;display:block;margin:0 auto" role="img" aria-label="Connections between workspaces"><defs>${mk("", "#5b6573")}${mk("g", "#2fc6a3")}${mk("v", "#b392f0")}</defs>${edges}${nodes}</svg>`;
}
P.connections = () => {

  return `<h1>Connections</h1><p class="lead">Which workspace may send hand-offs to, ask, or redirect agents to which other workspace. An arrow A → B means A may reach B; B may not reach A unless there is an arrow back.</p>${note("connections")}

function checkPerson(name){

function closeSecretTasks() {
  document.querySelectorAll('[data-secret-panel], [data-secret-new]').forEach(n => n.hidden = true);

const secretPick = scope => scope.querySelector('[data-secret-access]').value === 'all' ? 'all' : [...scope.querySelectorAll('[data-secret-workspace]:checked')].map(n => n.value);
document.addEventListener('change', e => {
  if (!e.target.matches('[data-secret-access], [data-secret-workspace]')) return;
  const scope = e.target.closest('[data-secret-card], [data-secret-new]'), pick = secretPick(scope);
  scope.querySelector('[data-secret-warning]').hidden = pick !== 'all';
  if (!scope.hasAttribute('data-secret-card')) return;
  const saved = D.secrets[+scope.dataset.secretCard].share;
  const dirty = JSON.stringify(pick) !== JSON.stringify(saved);
  scope.querySelector('[data-secret-share]').hidden = !dirty;
  scope.querySelector('[data-secret-unchanged]').hidden = dirty;
  const added = saved !== 'all' && (pick === 'all' ? D.ws.map(w => w.id) : pick).some(id => !saved.includes(id));
  scope.querySelector('[data-secret-added]').hidden = !added;
  if (added) scope.querySelector('[data-secret-entry]').hidden = false;
});
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const scope = b.closest('[data-secret-card], [data-secret-new]');
  if (b.hasAttribute('data-secret-add')) { closeSecretTasks(); document.querySelector('[data-secret-new]').hidden = false; b.hidden = true; }
  if (b.hasAttribute('data-secret-cancel')) closeSecretTasks();
  if (b.hasAttribute('data-secret-dismiss')) b.parentElement.hidden = true;
  if (b.hasAttribute('data-secret-manage')) {
    const opening = scope.querySelector('[data-secret-panel]').hidden; closeSecretTasks();
    scope.querySelector('[data-secret-panel]').hidden = !opening; scope.querySelector('[data-secret-summary]').hidden = opening; b.setAttribute('aria-expanded',String(opening));
  }
  for (const [action,target] of [['replace','entry'],['use','usage']]) if (b.hasAttribute('data-secret-'+action)) { const n = scope.querySelector('[data-secret-'+target+']'); n.hidden = !n.hidden; }
  if (b.hasAttribute('data-secret-remove')) {
    if (b.textContent !== 'Sure? Remove it') { b.textContent = 'Sure? Remove it'; return; }
    D.secrets.splice(+scope.dataset.secretCard,1); render();
  }
  if (b.hasAttribute('data-secret-save') || b.hasAttribute('data-secret-share')) {
    const fresh = scope.hasAttribute('data-secret-new'), pick = secretPick(scope);
    const name = fresh ? scope.querySelector('[data-secret-name]').value : D.secrets[+scope.dataset.secretCard].name;
    if (fresh && !/^[a-z][a-z0-9-]{0,39}$/.test(name)) return toast('Use a short name of lower-case letters, numbers and dashes.');
    if (fresh && pick !== 'all' && !pick.length) return toast('Pick at least one workspace.');
    const savingValue = b.hasAttribute('data-secret-save');
    if (savingValue) {
      const input = scope.querySelector('[data-secret-value]');
      if (input.value.length < 8 || input.value.length > 4096) return toast('Use between 8 and 4096 characters.');
      if (!/^[\x20-\x7e]+$/.test(input.value)) return toast('Use plain letters, numbers and symbols only (no accents, no line breaks).');
      if (input.value.trim() !== input.value) return toast('Remove the spaces at the start and the end.');
      input.value = '';
    }
    const item = fresh ? {name, uses:0} : D.secrets[+scope.dataset.secretCard];
    item.needsValue = !savingValue && !scope.querySelector('[data-secret-added]').hidden;
    item.share = pick;
    if (savingValue) item.exp = new Date(Date.now() + Number(scope.querySelector('[data-secret-days]').value)*86400000).toLocaleDateString('en', {day:'numeric',month:'short',year:'numeric'});
    if (fresh) D.secrets.push(item);
    render(); document.querySelector('[data-secret-confirm]').hidden = false;
  }
});

  if (d.svcDo) { const [id, how] = d.svcDo.split("|"); return doSvc(id, how); }
  if (d.logs) return openLogs(d.logs);
  if (d.person) return openPerson(d.person);
  if (d.grant) { const [gi, ws, l] = d.grant.split("|"); D.groups[+gi].grants[ws] = l; toast(`${esc(D.groups[+gi].name)} → ${esc(W(ws).name)}: ${l === "-" ? "no access" : l} (the workspace owner signs this)`); return render(); }
  if (d.pick) { const [k, v] = d.pick.split("|"); if (picks[k] === v) delete picks[k]; else picks[k] = v; const ex = $("#extraReq"); if (ex) picks.__extra = ex.value; savePicks(); return render(); }
  if (d.toggle !== undefined) { t.classList.toggle("on"); return toast("Mockup: setting changed"); }
  if (d.toast) { if (t.closest(".dlg") && !t.closest("[data-keep]")) close(); return toast(esc(d.toast)); }
  if (t.matches(".seg button")) { t.parentElement.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b === t)); }
});
$("#offT").addEventListener("change", (e) => setOffline(e.target.checked));
function setLv(gi, ws, to){
  const orig = D.groups[gi].grants[ws] || "-";
  gPending = gPending.filter((p) => !(p.gi === gi && p.ws === ws));
  if (to !== orig) gPending.push({gi, ws, to});
  delete gWaiting[gi + "|" + ws];
  render();
}
document.addEventListener("change", (e) => {
  const d = e.target.dataset;
  if (d.setlv) { const [gi, ws] = d.setlv.split("|"); setLv(+gi, ws, e.target.value); }
  if (d.addws) { setLv(+d.addws, e.target.value, "read"); }
  if (d.addperson) { const g = D.groups[+d.addperson]; g.members.push(e.target.value); toast(`${esc(e.target.value)} added to ${esc(g.name)} (mockup)`); render(); }
  if (d.checkpick !== undefined) checkPerson(e.target.value);
});
document.addEventListener("click", (e) => { if (e.target.id === "retryB") { e.target.classList.add("loading"); e.target.textContent = " Trying…"; setTimeout(() => { if ($("#offT").checked) { e.target.classList.remove("loading"); e.target.textContent = "Try now"; toast("Still no connection · next try in 10 s"); } }, 900); } });
$("#notesT").addEventListener("change", (e) => { document.body.classList.toggle("nonotes", !e.target.checked); try { localStorage.setItem("hubfull-notes", e.target.checked ? "1" : "0"); } catch {} });
try { if (localStorage.getItem("hubfull-notes") === "0") { $("#notesT").checked = false; document.body.classList.add("nonotes"); } } catch {}
render();
</script>
