[project]
name = "orch-hub"
version = "2.0.0.dev0"
description = "orch hub: users, groups, roles, custodial signing and routing between orch workspaces and the edge"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=43",
    "joserfc==1.7.7",
    "pyopenssl>=24.3",
]

[project.scripts]
orch-hub = "orch_hub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orch_hub"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pytest-timeout>=2.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = ["slow: tests taking more than 2 s"]
timeout = 120

[tool.ruff]
line-length = 120
