[project]
name = "orch-relay"
version = "2.0.0.dev0"
description = "orch-relay: hub accounts, hub channels and hub phone push for orch V3"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "cryptography>=43",
    # P3-D40: the APNs client (HTTP/2). Pinned exactly; hashes are in uv.lock.
    "httpx[http2]==0.28.1",
]

[project.scripts]
orch-relay = "orch_relay.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orch_relay"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pytest-timeout>=2.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", "tests"]
markers = [
    "slow: tests taking more than 2 s",
    "raw_data: create_app opens the data dir by the real format rule (no format.json is written for it)",
]
timeout = 120

[tool.ruff]
line-length = 100
