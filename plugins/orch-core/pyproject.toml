[project]
name = "orch-core"
version = "2.0.0.dev0"
description = "Local markdown ticket system with human-in-the-loop gates for agent harnesses (v2 core)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "cryptography>=43",
    "jsonschema>=4.26.0",
]

[project.scripts]
orch = "orch.cli.main:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3.6", "hypothesis>=6", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--durations=15"
markers = [
    "slow: takes more than ~2 s (builds wheels, property sweeps); a quick loop skips it with -m 'not slow'",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
