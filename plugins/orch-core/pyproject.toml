[project]
name = "orch-core"
version = "0.4.5"
description = "Local markdown ticket system with human-in-the-loop gates for agent harnesses"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["typer>=0.12", "pyyaml>=6.0", "jsonschema>=4.21", "filelock>=3.13", "markdown-it-py>=3.0"]

[project.optional-dependencies]
dashboard = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "watchfiles>=0.21",
    "python-multipart>=0.0.9",
    "segno>=1.6",
    "cryptography>=42",  # Orch Remote's bridge (orch.remote.bridge_host), imported only when the bridge is used
]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
orch = "orch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orch"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "orch/instructions/skills"
"addons" = "orch/default_addons"
"docs/tasks-view.schema.json" = "orch/schemas/tasks-view.schema.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
