{% extends "layout.html" %}
{% block main %}
<p class="crumb"><a class="lnk" href="/board">Board</a> / <a class="lnk" href="/t/{{ tid }}">{{ tid }}</a> / raw file</p>
<div class="page-head">
  <div>
    <h1>{{ tid }} raw file</h1>
    <p><code>{{ path }}</code></p>
  </div>
  {% if editable %}<div class="actions"><a class="btn" href="/t/{{ tid }}/edit">Edit this file</a></div>{% endif %}
</div>
{% if not editable %}<p class="flash err" role="status">This file does not parse, so it cannot be edited here; repair it in your editor.</p>{% endif %}
<pre class="card">{{ text }}</pre>
{% endblock %}
