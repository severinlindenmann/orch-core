<style>
  .wf { padding: 12px; display: grid; gap: 8px; }
  .wf-head { display: flex; flex-wrap: wrap; gap: 4px 16px; font: var(--type-meta); color: var(--muted); }
  .wf-head b { color: var(--text); }
  .wf-list { list-style: none; margin: 0; padding: 0; display: grid; }
  .wf-row { border-top: 1px solid var(--line); }
  .wf-btn { width: 100%; display: grid; grid-template-columns: 22px minmax(70px, 30%) minmax(0, 1fr) 56px; gap: 8px; align-items: center;
            padding: 6px 4px; border: 0; background: none; text-align: left; cursor: pointer; }
  .wf-btn:hover { background: var(--hover); }
  .wf-icon { font-weight: 800; text-align: center; }
  .wf-ok .wf-icon { color: var(--ok-mark); }
  .wf-fail .wf-icon { color: var(--err-mark); }
  .wf-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-mono); font-size: 12px; }
  .wf-fail .wf-name::after { content: " failed"; font-family: var(--font-body); color: var(--err-fg); font-weight: 700; }
  .wf-track { position: relative; height: 14px; background: var(--surface2); border-radius: 3px; }
  .wf-bar { position: absolute; top: 2px; bottom: 2px; min-width: 2px; border-radius: 2px; background: var(--info-mark); }
  .wf-fail .wf-bar { background: var(--err-mark); }
  .wf-dur { text-align: right; font: var(--type-meta); font-variant-numeric: tabular-nums; }
  .wf-detail { padding: 4px 8px 10px 34px; display: grid; gap: 6px; }
  .wf-detail h4 { margin: 0; font: var(--type-meta); color: var(--muted); }
  .wf-detail pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 12px/1.45 var(--font-mono); background: var(--surface2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  .wf-detail p { margin: 0; }
  .wf-tools { display: flex; gap: 6px; }
  .wf-tools button { padding: 4px 10px; border-radius: var(--r-pill); border: 1px solid var(--line2); background: var(--surface); cursor: pointer; }
  @media (max-width: 420px) { .wf-btn { grid-template-columns: 18px minmax(0, 1fr) 48px; } .wf-track { grid-column: 2 / 4; grid-row: 2; } }
</style>
<div class="wf">
  <div class="wf-head" id="head"></div>
  <div class="wf-tools"><button type="button" id="all">Open all</button><button type="button" id="fails" aria-pressed="false">Only failures</button></div>
  <ul class="wf-list" id="list"></ul>
</div>
<script>
(function () {
  var d = orch.data, unit = d.unit || "s", calls = d.calls;
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function fmt(v) { return unit === "ms" ? (v >= 1000 ? (v / 1000).toFixed(1) + " s" : Math.round(v) + " ms") : (v >= 60 ? Math.floor(v / 60) + "m " + Math.round(v % 60) + "s" : (v < 10 ? v.toFixed(1) : Math.round(v)) + " s"); }
  var end = Math.max.apply(null, calls.map(function (c) { return c.start + c.duration; })) || 1;
  var failed = calls.filter(function (c) { return !c.ok; });
  var busiest = calls.slice().sort(function (a, b) { return b.duration - a.duration; })[0];

  $("head").innerHTML = "";
  [["Calls", calls.length], ["Run", fmt(end)], ["Failed", failed.length], ["Longest", busiest.name + " · " + fmt(busiest.duration)]].forEach(function (p) {
    var s = el("span", null, p[0] + " "); s.appendChild(el("b", null, String(p[1]))); $("head").appendChild(s);
  });

  var rows = calls.map(function (c, i) {
    var li = el("li", "wf-row " + (c.ok ? "wf-ok" : "wf-fail"));
    var b = el("button", "wf-btn"); b.type = "button";
    b.setAttribute("aria-expanded", "false"); b.setAttribute("aria-controls", "wf-d" + i);
    b.setAttribute("aria-label", c.name + ", " + (c.ok ? "ok" : "failed") + ", starts at " + fmt(c.start) + ", takes " + fmt(c.duration));
    b.appendChild(el("span", "wf-icon", c.ok ? "✓" : "✗"));
    b.appendChild(el("span", "wf-name", c.name));
    var track = el("span", "wf-track"), bar = el("span", "wf-bar");
    bar.style.left = (c.start / end * 100) + "%"; bar.style.width = (c.duration / end * 100) + "%";
    track.appendChild(bar); b.appendChild(track);
    b.appendChild(el("span", "wf-dur", fmt(c.duration)));
    var det = el("div", "wf-detail"); det.id = "wf-d" + i; det.hidden = true;
    det.appendChild(el("p", null, "Starts at " + fmt(c.start) + ", ends at " + fmt(c.start + c.duration) + ". " + (c.ok ? "Finished." : "Failed.")));
    if (c.note) det.appendChild(el("p", null, c.note));
    if (c.input) { det.appendChild(el("h4", null, "Input")); det.appendChild(el("pre", null, c.input)); }
    if (c.result) { det.appendChild(el("h4", null, c.ok ? "Result" : "Error")); det.appendChild(el("pre", null, c.result)); }
    b.addEventListener("click", function () { var open = b.getAttribute("aria-expanded") !== "true"; b.setAttribute("aria-expanded", String(open)); det.hidden = !open; });
    li.appendChild(b); li.appendChild(det); $("list").appendChild(li);
    return { li: li, b: b, det: det, c: c };
  });

  $("all").addEventListener("click", function () {
    var open = rows.some(function (r) { return r.det.hidden; });
    rows.forEach(function (r) { r.det.hidden = !open; r.b.setAttribute("aria-expanded", String(open)); });
    $("all").textContent = open ? "Close all" : "Open all";
  });
  if (!failed.length) $("fails").hidden = true;
  $("fails").addEventListener("click", function () {
    var on = $("fails").getAttribute("aria-pressed") !== "true";
    $("fails").setAttribute("aria-pressed", String(on));
    rows.forEach(function (r) { r.li.hidden = on && r.c.ok; });
  });

  var text = [calls.length + " tool calls over " + fmt(end) + "; " + failed.length + " failed."];
  calls.forEach(function (c, i) {
    text.push((i + 1) + ". " + c.name + " at " + fmt(c.start) + " for " + fmt(c.duration) + ": " + (c.ok ? "ok" : "FAILED") +
      (c.note ? " — " + c.note : "") + (!c.ok && c.result ? " (" + c.result.slice(0, 200) + ")" : ""));
  });
  orch.text(text.join("\n"));
  orch.ready();
})();
</script>
