<style>
  .ba { padding: 12px; display: grid; gap: 10px; }
  .ba-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .ba-bar .gap { flex: 1; }
  .ba button { min-height: 32px; padding: 4px 12px; border: 1px solid var(--line2); border-radius: var(--r-pill); background: var(--surface); cursor: pointer; }
  .ba button[aria-pressed=true] { background: var(--text); color: var(--surface); border-color: var(--text); }
  .ba-stage { position: relative; margin: 0 auto; width: 100%; border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; background: var(--surface2); }
  .ba-stage img { display: block; width: 100%; height: auto; user-select: none; }
  .ba-after { position: absolute; inset: 0; }
  .ba-after img { height: 100%; object-fit: cover; object-position: left top; }
  .ba-line { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--text); box-shadow: 0 0 0 1px var(--surface); pointer-events: none; }
  .ba-tag { position: absolute; bottom: 6px; padding: 2px 8px; border-radius: var(--r-pill); font: var(--type-meta); background: var(--overlay); color: var(--text); border: 1px solid var(--line); }
  .ba-tag.b { left: 6px; } .ba-tag.a { right: 6px; }
  .ba-region { position: absolute; border: 2px dashed var(--warn-mark); border-radius: 4px; pointer-events: none; }
  .ba-region span { position: absolute; top: -10px; left: -10px; width: 20px; height: 20px; border-radius: 50%; background: var(--warn-mark); color: #fff; font: var(--type-meta); display: grid; place-items: center; }
  .ba-slider { width: 100%; margin: 0 auto; display: block; accent-color: var(--text); }
  .ba-notes { margin: 0; padding-left: 22px; font: var(--type-body); }
  .ba-notes li::marker { font-weight: 700; color: var(--warn-fg); }
  .ba-summary { margin: 0; color: var(--muted); font: var(--type-body); }
</style>
<div class="ba">
  <div class="ba-bar">
    <span role="group" aria-label="Viewport" id="vp"></span>
    <span class="gap"></span>
    <button type="button" id="regions" aria-pressed="false">Changed regions</button>
  </div>
  <div class="ba-stage" id="stage">
    <img id="before" alt="">
    <div class="ba-after" id="afterBox"><img id="after" alt=""></div>
    <div class="ba-line" id="line"></div>
    <span class="ba-tag b" id="tagB"></span><span class="ba-tag a" id="tagA"></span>
  </div>
  <input class="ba-slider" id="slider" type="range" min="0" max="100" value="50">
  <ol class="ba-notes" id="notes" hidden></ol>
  <p class="ba-summary" id="summary"></p>
</div>
<script>
(function () {
  var d = orch.data, views = d.views, labels = d.labels || {};
  var lb = labels.before || "Before", la = labels.after || "After";
  var $ = function (id) { return document.getElementById(id); };
  var current = 0, showRegions = false;
  $("tagB").textContent = lb; $("tagA").textContent = la;
  $("summary").textContent = d.summary;
  $("slider").setAttribute("aria-label", "Reveal: " + lb + " on the left, " + la + " on the right");

  views.forEach(function (v, i) {
    var b = document.createElement("button");
    b.type = "button"; b.textContent = v.viewport + " px";
    b.setAttribute("aria-pressed", String(i === 0));
    b.addEventListener("click", function () { current = i; draw(); });
    $("vp").appendChild(b);
  });
  if (views.length < 2) $("vp").hidden = true;
  if (!views.some(function (v) { return v.regions && v.regions.length; })) $("regions").hidden = true;
  $("regions").addEventListener("click", function () { showRegions = !showRegions; draw(); });
  $("slider").addEventListener("input", place);

  function place() {
    var p = Number($("slider").value);
    $("afterBox").style.clipPath = "inset(0 0 0 " + p + "%)";
    $("line").style.left = p + "%";
    $("slider").setAttribute("aria-valuetext", p + "% " + lb + ", " + (100 - p) + "% " + la);
  }

  function draw() {
    var v = views[current];
    Array.prototype.forEach.call($("vp").children, function (b, i) { b.setAttribute("aria-pressed", String(i === current)); });
    $("regions").setAttribute("aria-pressed", String(showRegions));
    var max = Math.min(v.viewport, 1280) + "px";
    $("stage").style.maxWidth = max; $("slider").style.maxWidth = max;
    $("before").src = v.before; $("before").alt = lb + " at " + v.viewport + " px";
    $("after").src = v.after; $("after").alt = la + " at " + v.viewport + " px";
    Array.prototype.slice.call(document.querySelectorAll(".ba-region")).forEach(function (n) { n.remove(); });
    var notes = $("notes"); notes.textContent = "";
    var rs = (showRegions && v.regions) || [];
    rs.forEach(function (r, i) {
      var box = document.createElement("div");
      box.className = "ba-region";
      box.style.left = r.x * 100 + "%"; box.style.top = r.y * 100 + "%";
      box.style.width = r.w * 100 + "%"; box.style.height = r.h * 100 + "%";
      var n = document.createElement("span"); n.textContent = i + 1; box.appendChild(n);
      $("stage").appendChild(box);
      var li = document.createElement("li"); li.textContent = r.note; notes.appendChild(li);
    });
    notes.hidden = !rs.length;
    place();
  }

  var lines = [d.summary];
  views.forEach(function (v) {
    lines.push(v.viewport + " px: " + lb + " and " + la + " screenshots" +
      (v.regions && v.regions.length ? "; changed regions: " + v.regions.map(function (r, i) { return (i + 1) + ". " + r.note; }).join(" ") : "."));
  });
  orch.text(lines.join("\n"));
  draw();
  var img = $("before");
  if (img.complete) orch.ready(); else { img.addEventListener("load", function () { orch.ready(); }, { once: true }); img.addEventListener("error", function () { orch.error("The before image could not be decoded."); }, { once: true }); }
})();
</script>
