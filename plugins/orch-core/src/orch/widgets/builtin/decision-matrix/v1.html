<style>
  .dm { padding: 12px; display: grid; gap: 12px; }
  .dm-rank { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .dm-rank li { display: grid; grid-template-columns: 26px minmax(80px, 34%) minmax(0, 1fr) 40px; gap: 8px; align-items: center; }
  .dm-pos { font: var(--type-stat); color: var(--muted); }
  .dm-rank li:first-child .dm-pos { color: var(--text); }
  .dm-label { overflow-wrap: anywhere; }
  .dm-tag { margin-left: 4px; padding: 0 6px; border-radius: var(--r-pill); background: var(--info-bg); color: var(--info-fg); font: var(--type-meta); white-space: nowrap; }
  .dm-track { height: 12px; border-radius: 3px; background: var(--surface2); overflow: hidden; }
  .dm-bar { height: 100%; background: var(--neu-mark); transition: width var(--dur-2) var(--ease-out); }
  .dm-rank li:first-child .dm-bar { background: var(--ok-mark); }
  .dm-val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
  .dm-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-sm); }
  .dm table { border-collapse: collapse; width: 100%; font: var(--type-body); }
  .dm th, .dm td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  .dm th:first-child, .dm td:first-child { text-align: left; white-space: normal; min-width: 124px; position: sticky; left: 0; background: var(--surface); z-index: 1; }
  .dm thead th { font: var(--type-meta); color: var(--muted); background: var(--surface2); }
  .dm td.best { font-weight: 800; }
  .dm-crit { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .dm-crit span:first-child { flex: 1 1 80px; }
  .dm-w { display: inline-flex; align-items: center; gap: 2px; }
  .dm-w button { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line2); background: var(--surface); cursor: pointer; }
  .dm-w button:disabled { opacity: .4; cursor: default; }
  .dm-w output { min-width: 34px; text-align: center; font: var(--type-meta); }
  .dm-foot { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font: var(--type-meta); color: var(--muted); }
  .dm-foot button { padding: 4px 10px; border-radius: var(--r-pill); border: 1px solid var(--line2); background: var(--surface); cursor: pointer; color: var(--text); }
</style>
<div class="dm">
  <ol class="dm-rank" id="rank" aria-live="polite" aria-label="Ranking by weighted score"></ol>
  <div class="dm-wrap"><table id="table"></table></div>
  <div class="dm-foot"><button type="button" id="reset" disabled>Reset weights</button><span id="note"></span></div>
</div>
<script>
(function () {
  var d = orch.data, crit = d.criteria, opts = d.options;
  var scale = d.scale || { min: 0, max: 10 };
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  var bad = opts.filter(function (o) { return o.scores.length !== crit.length; });
  if (bad.length) { orch.text("The matrix data is inconsistent: " + bad.map(function (o) { return o.label; }).join(", ") + " must have one score per criterion."); orch.error("Each option needs exactly " + crit.length + " scores."); return; }
  var initial = crit.map(function (c) { return c.weight; }), weights = initial.slice();

  function score(o) {
    var sw = 0, s = 0;
    weights.forEach(function (w, i) { sw += w; s += w * o.scores[i]; });
    return sw ? s / sw : 0;
  }
  function fmt(n) { return (Math.round(n * 10) / 10).toFixed(1); }

  var table = $("table"), head = el("tr");
  head.appendChild(el("th", null, "Criterion · weight"));
  opts.forEach(function (o) { var th = el("th", null, o.label); th.scope = "col"; head.appendChild(th); });
  var thead = el("thead"); thead.appendChild(head); table.appendChild(thead);
  var tbody = el("tbody"), outs = [], minus = [], plus = [];
  crit.forEach(function (c, i) {
    var tr = el("tr"), th = el("th"); th.scope = "row";
    var box = el("div", "dm-crit"), name = el("span", null, c.label);
    if (c.why) name.title = c.why;
    var w = el("span", "dm-w"); w.setAttribute("role", "group"); w.setAttribute("aria-label", "Weight of " + c.label);
    var m = el("button", null, "−"), out = el("output"), p = el("button", null, "+");
    m.type = p.type = "button";
    m.setAttribute("aria-label", "Lower the weight of " + c.label); p.setAttribute("aria-label", "Raise the weight of " + c.label);
    m.addEventListener("click", function () { if (weights[i] > 0) { weights[i]--; update(); } });
    p.addEventListener("click", function () { if (weights[i] < 5) { weights[i]++; update(); } });
    w.appendChild(m); w.appendChild(out); w.appendChild(p);
    box.appendChild(name); box.appendChild(w); th.appendChild(box); tr.appendChild(th);
    var best = Math.max.apply(null, opts.map(function (o) { return o.scores[i]; }));
    opts.forEach(function (o) { var td = el("td", o.scores[i] === best ? "best" : null, String(o.scores[i])); tr.appendChild(td); });
    tbody.appendChild(tr); outs.push(out); minus.push(m); plus.push(p);
  });
  table.appendChild(tbody);
  $("reset").addEventListener("click", function () { weights = initial.slice(); update(); });
  $("note").textContent = "Scores " + scale.min + "–" + scale.max + ", higher is better. Changing weights here records nothing.";

  function ranking() {
    return opts.map(function (o) { return { o: o, s: score(o) }; }).sort(function (a, b) { return b.s - a.s; });
  }

  function update() {
    weights.forEach(function (w, i) { outs[i].textContent = "×" + w; minus[i].disabled = w <= 0; plus[i].disabled = w >= 5; });
    $("reset").disabled = weights.every(function (w, i) { return w === initial[i]; });
    var r = ranking(), list = $("rank"); list.textContent = "";
    var span = (scale.max - scale.min) || 1;
    r.forEach(function (x, i) {
      var li = el("li");
      li.appendChild(el("span", "dm-pos", String(i + 1)));
      var lab = el("span", "dm-label", x.o.label);
      if (x.o.id === d.pick) lab.appendChild(el("span", "dm-tag", "agent's pick"));
      li.appendChild(lab);
      var track = el("span", "dm-track"), bar = el("span", "dm-bar");
      bar.style.display = "block"; bar.style.width = Math.max(0, (x.s - scale.min) / span * 100) + "%";
      track.appendChild(bar); li.appendChild(track);
      li.appendChild(el("span", "dm-val", fmt(x.s)));
      list.appendChild(li);
    });
    var changed = $("reset").disabled ? "the author's weights" : "weights changed by the reader";
    orch.text("Ranking with " + changed + ": " + r.map(function (x, i) { return (i + 1) + ". " + x.o.label + " " + fmt(x.s); }).join(", ") + ".\n" +
      "Weights: " + crit.map(function (c, i) { return c.label + " ×" + weights[i]; }).join(", ") + ".\n" +
      "Scores (" + scale.min + "–" + scale.max + "): " + opts.map(function (o) { return o.label + " [" + o.scores.join(", ") + "]"; }).join("; ") + "." +
      (d.pick ? "\nAgent's pick: " + (opts.filter(function (o) { return o.id === d.pick; })[0] || { label: d.pick }).label + "." : ""));
  }
  update();
  orch.ready();
})();
</script>
