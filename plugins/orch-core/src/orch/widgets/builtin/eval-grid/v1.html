<style>
  .eg { padding: 12px; display: grid; gap: 10px; }
  .eg-sum { display: flex; flex-wrap: wrap; gap: 8px; }
  .eg-stat { padding: 6px 10px; border-radius: var(--r-md); border: 1px solid var(--line); min-width: 92px; }
  .eg-stat b { display: block; font: var(--type-stat); }
  .eg-stat span { font: var(--type-meta); color: var(--muted); }
  .eg-stat.fixed b { color: var(--ok-fg); } .eg-stat.broke b { color: var(--err-fg); }
  .eg-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font: var(--type-meta); color: var(--muted); }
  .eg-bar button { padding: 4px 10px; border-radius: var(--r-pill); border: 1px solid var(--line2); background: var(--surface); color: var(--text); cursor: pointer; }
  .eg-bar button[aria-pressed=true] { background: var(--text); color: var(--surface); border-color: var(--text); }
  .eg-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-sm); }
  .eg table { border-collapse: collapse; width: 100%; }
  .eg th, .eg td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; font: var(--type-body); }
  .eg thead th { font: var(--type-meta); color: var(--muted); background: var(--surface2); position: sticky; top: 0; }
  .eg tbody th { font-weight: 400; white-space: normal; min-width: 124px; }
  .eg tbody th.eg-id { font: 12px/1.45 var(--font-mono); }
  .eg td { font: var(--type-meta); }
  .eg-pass { color: var(--ok-fg); } .eg-fail, .eg-error { color: var(--err-fg); } .eg-skip, .eg-none { color: var(--muted); }
  .eg-chg { font: var(--type-meta); padding: 1px 6px; border-radius: var(--r-pill); }
  .eg-chg.fixed { background: var(--ok-bg); color: var(--ok-fg); } .eg-chg.broke { background: var(--err-bg); color: var(--err-fg); }
  .eg-note { display: block; font-family: var(--font-body); color: var(--muted); }
</style>
<div class="eg">
  <div class="eg-sum" id="sum"></div>
  <div class="eg-bar"><button type="button" id="diff" aria-pressed="false">Only differences</button><span id="cmp"></span></div>
  <div class="eg-wrap"><table id="table"></table></div>
</div>
<script>
(function () {
  var d = orch.data, vs = d.variants, cases = d.cases;
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  var base = d.baseline || vs[0].id, comp = d.compare || vs[vs.length - 1].id;
  var label = {}; vs.forEach(function (v) { label[v.id] = v.label; });
  var ICON = { pass: "✓ pass", fail: "✗ fail", error: "! error", skip: "– skip" };
  function change(c) {
    var a = c.results[base] === "pass", b = c.results[comp] === "pass";
    if (!a && b) return "fixed";
    if (a && !b) return "broke";
    return "";
  }
  function differs(c) { var seen = {}; vs.forEach(function (v) { seen[c.results[v.id] || "none"] = 1; }); return Object.keys(seen).length > 1; }

  var passes = vs.map(function (v) { return cases.filter(function (c) { return c.results[v.id] === "pass"; }).length; });
  var fixed = cases.filter(function (c) { return change(c) === "fixed"; }), broke = cases.filter(function (c) { return change(c) === "broke"; });
  [["fixed", fixed.length, "fixed"], ["broke", broke.length, "broke"],
   ["", passes[vs.map(function (v) { return v.id; }).indexOf(comp)] + "/" + cases.length, "pass in " + label[comp]],
   ["", passes[vs.map(function (v) { return v.id; }).indexOf(base)] + "/" + cases.length, "pass in " + label[base]]].forEach(function (s) {
    var box = el("div", "eg-stat " + s[0]); box.appendChild(el("b", null, String(s[1]))); box.appendChild(el("span", null, s[2])); $("sum").appendChild(box);
  });
  $("cmp").textContent = "Fixed and broke compare " + label[base] + " → " + label[comp] + ".";
  if (vs.length < 2) $("diff").hidden = true;

  var table = $("table"), tr = el("tr");
  tr.appendChild(el("th", null, "Case"));
  vs.forEach(function (v) { var th = el("th", null, v.label); th.scope = "col"; tr.appendChild(th); });
  tr.appendChild(el("th", null, "Change"));
  var thead = el("thead"); thead.appendChild(tr); table.appendChild(thead);
  var tbody = el("tbody"), rows = [];
  cases.forEach(function (c) {
    var r = el("tr"), th = el("th", c.label ? null : "eg-id", c.label || c.id); th.scope = "row";
    if (c.note) th.appendChild(el("span", "eg-note", c.note));
    r.appendChild(th);
    vs.forEach(function (v) { var s = c.results[v.id]; r.appendChild(el("td", "eg-" + (s || "none"), s ? ICON[s] : "not run")); });
    var ch = change(c), td = el("td");
    if (ch) td.appendChild(el("span", "eg-chg " + ch, ch));
    r.appendChild(td); tbody.appendChild(r); rows.push({ r: r, c: c });
  });
  table.appendChild(tbody);
  $("diff").addEventListener("click", function () {
    var on = $("diff").getAttribute("aria-pressed") !== "true";
    $("diff").setAttribute("aria-pressed", String(on));
    rows.forEach(function (x) { x.r.hidden = on && !differs(x.c); });
  });

  var text = [cases.length + " cases × " + vs.length + " variants. " + label[base] + " → " + label[comp] + ": " + fixed.length + " fixed, " + broke.length + " broke.",
    "Passing: " + vs.map(function (v, i) { return v.label + " " + passes[i] + "/" + cases.length; }).join(", ") + "."];
  if (fixed.length) text.push("Fixed: " + fixed.map(function (c) { return c.label || c.id; }).join(", ") + ".");
  if (broke.length) text.push("Broke: " + broke.map(function (c) { return c.label || c.id; }).join(", ") + ".");
  var others = cases.filter(function (c) { return !change(c) && differs(c); });
  if (others.length) text.push("Other differences: " + others.map(function (c) { return (c.label || c.id) + " (" + vs.map(function (v) { return v.label + " " + (c.results[v.id] || "not run"); }).join(", ") + ")"; }).join("; ") + ".");
  orch.text(text.join("\n"));
  orch.ready();
})();
</script>
