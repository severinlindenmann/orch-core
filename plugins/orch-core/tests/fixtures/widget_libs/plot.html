<div id="c"></div>
<script>
try {
  var rows = orch.data.rows;
  document.getElementById("c").append(Plot.plot({width: 320, height: 160,
    marks: [Plot.barY(rows, {x: "a", y: "b", fill: orch.theme.var("--ok-mark") || "green"}), Plot.ruleY([0])]}));
  orch.text("Plot + d3: " + rows.length + " bars, max " + d3.max(rows, function (r) { return r.b; }));
  orch.ready();
} catch (e) { orch.error("plot: " + e.message); }
</script>
