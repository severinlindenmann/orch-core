<div id="c"></div>
<script>
try {
  var d = orch.data;
  new uPlot({width: 320, height: 160, series: [{}, {label: d.unit, stroke: orch.theme.var("--info-mark") || "#36c"}]},
            [d.x, d.y], document.getElementById("c"));
  orch.text("uPlot: " + d.y.length + " points, max " + Math.max.apply(null, d.y) + " " + d.unit);
  orch.ready();
} catch (e) { orch.error("uplot: " + e.message); }
</script>
